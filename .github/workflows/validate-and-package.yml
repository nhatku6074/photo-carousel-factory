name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Render fictional demo
        run: python scripts/render_carousel.py examples/fictional-product-demo
      - name: Validate fictional demo
        run: python scripts/validate_carousel.py examples/fictional-product-demo
      - name: Build release ZIP
        run: python scripts/package_release.py . --version 1.0.0
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-carousel-factory-v1.0.0
          path: dist/photo-carousel-factory-v1.0.0.zip

